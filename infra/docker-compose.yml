# StreamHouse — local stack.
#
# Core profile only for Phase 0. Everything runs locally; no cloud services, credentials or SDKs.
#   docker compose -f infra/docker-compose.yml --profile core up -d
#
# connect and spark come up idle. No connector is registered and no job is submitted until Phase 2.
# They run so the stack is complete and its health is meaningful.

name: streamhouse

# Shared by every Airflow component. A top-level extension field, NOT a service: anything
# under `services:` is a service, even if its key starts with x-, and compose would try to
# build and run it.
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: streamhouse/airflow:3.0.1-docker
  profiles: ["orchestration"]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${SH_AIRFLOW_DB_USER:-airflow}:${SH_AIRFLOW_DB_PASSWORD:?set SH_AIRFLOW_DB_PASSWORD in .env}@postgres-meta:5432/${SH_AIRFLOW_DB_NAME:-airflow}
    # Airflow 3 signs internal API calls with this. A fixed value keeps the components
    # agreeing across restarts; it is a local dev secret like every other one here.
    AIRFLOW__API_AUTH__JWT_SECRET: ${SH_AIRFLOW_JWT_SECRET:?set SH_AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__BASE_URL: http://localhost:${SH_AIRFLOW_PORT:-8088}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Airflow 3 removed `airflow users create`; user management belongs to the auth manager
    # now, and the default is SimpleAuthManager. all_admins means the local UI needs no login
    # at all - correct for a single-user stack on a laptop, and nothing a shared one should do.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # The DAGs shell out to `docker exec`, so they are told the container and paths rather
    # than hardcoding them in three places.
    SH_SPARK_CONTAINER: sh-spark-master
    SH_REPO_IN_SPARK: /opt/streamhouse
  volumes:
    # DAGs read-only: Airflow runs them, it does not own them.
    - ../orchestration/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    # The Docker socket is how Airflow starts Spark work. See infra/airflow/Dockerfile and
    # ADR-0011 for the trade-off this represents.
    - /var/run/docker.sock:/var/run/docker.sock
  # The socket is root:<docker gid>, and the airflow user needs that group to use it. The gid
  # is machine-specific - `stat -c %g /var/run/docker.sock` - so it comes from .env.
  group_add:
    - "${SH_DOCKER_GID:-1001}"
  depends_on:
    postgres-meta:
      condition: service_healthy
  restart: unless-stopped

services:

  # ---------------------------------------------------------------- OLTP source
  postgres:
    image: postgres:16
    container_name: sh-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${SH_POSTGRES_USER:-streamhouse}
      POSTGRES_PASSWORD: ${SH_POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${SH_POSTGRES_DB:-streamhouse}
    # wal_level is set here rather than via ALTER SYSTEM so it is live on first boot.
    # ALTER SYSTEM would require a restart before Debezium could read the WAL.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${SH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first boot against an empty volume. `make db-init` re-applies it on demand.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SH_POSTGRES_USER:-streamhouse} -d ${SH_POSTGRES_DB:-streamhouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------- message bus
  redpanda:
    # v24.2.x rejects Fetch API v12, which librdkafka 2.6 (confluent-kafka) negotiates:
    #   WARN kafka - Unsupported version 12 for fetch API
    # Producing worked, consuming did not. 24.3+ supports it. Do not downgrade.
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    container_name: sh-redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      # Two listeners: `internal` for containers, `external` for the host.
      # The external listener advertises localhost:9092 so host clients reconnect correctly.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:9092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${SH_REDPANDA_PORT:-9092}:19092"        # Kafka API
      - "${SH_SCHEMA_REGISTRY_PORT:-8081}:18081" # built-in schema registry
      - "9644:9644"                           # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: sh-redpanda-console
    profiles: ["core"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: streamhouse
      CONNECT_CLUSTERS_URL: http://connect:8083
    ports:
      - "${SH_CONSOLE_PORT:-8080}:8080"
    # No healthcheck: the console image ships no shell HTTP client to probe with.
    # Verify it by opening http://localhost:8080 instead.
    restart: unless-stopped

  # ---------------------------------------------------------------- CDC (idle until Phase 2)
  connect:
    # Built, not pulled: the stock debezium/connect image has no Avro converter. See
    # infra/connect/Dockerfile, which also strips Confluent's bundled cloud KMS SDKs.
    # (`2.7` is not a published Debezium tag; only X.Y.Z.Final exists.)
    build:
      context: ./connect
      dockerfile: Dockerfile
    image: streamhouse/connect:2.7.3.Final-avro
    container_name: sh-connect
    profiles: ["core"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: streamhouse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Defaults to JSON. Phase 2 switches these to Avro against the schema registry.
    ports:
      - "${SH_CONNECT_PORT:-8083}:8083"
    healthcheck:
      # /connectors, NOT / - the bare root is served by the REST layer alone and answers 200
      # even when the herder thread is dead, so a broken Connect reported "healthy" through
      # 39 restart loops. /connectors has to reach the herder, so it fails when Connect is
      # actually unable to do any work.
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------- object store
  minio:
    # Docker Hub's minio/minio now requires authentication; quay.io is the public registry.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sh-minio
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SH_MINIO_ROOT_USER:-streamhouse}
      MINIO_ROOT_PASSWORD: ${SH_MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (min 8 chars)}
    ports:
      - "${SH_MINIO_PORT:-9000}:9000"          # S3 API
      - "${SH_MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- compute (idle until Phase 2)
  spark-master:
    # Built, not pulled: the stock image has no Delta, no S3A and no Kafka jars.
    # See infra/spark/Dockerfile.
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: streamhouse/spark:3.5.3-delta
    container_name: sh-spark-master
    profiles: ["core"]
    environment:
      # S3A reads these via EnvironmentVariableCredentialsProvider; they are never written
      # into the committed spark-defaults.conf.
      AWS_ACCESS_KEY_ID: ${SH_MINIO_ROOT_USER:-streamhouse}
      AWS_SECRET_ACCESS_KEY: ${SH_MINIO_ROOT_PASSWORD:?set SH_MINIO_ROOT_PASSWORD in .env}
    volumes:
      # Read-only: Spark runs the code, it does not own it.
      - ../:/opt/streamhouse:ro
      # dbt's Hive metastore (Derby). It has to outlive the container, or every `dbt test`
      # would run against a catalog that forgot what `dbt run` created. Only dbt uses it.
      - metastore-data:/opt/metastore
      # dbt writes target/ and logs/, and the repo mount above is read-only.
      - dbt-target:/opt/dbt-target
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      - "7077:7077"                        # cluster endpoint
      - "${SH_SPARK_UI_PORT:-8090}:8080"      # master web UI
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    image: streamhouse/spark:3.5.3-delta
    container_name: sh-spark-worker
    profiles: ["core"]
    environment:
      AWS_ACCESS_KEY_ID: ${SH_MINIO_ROOT_USER:-streamhouse}
      AWS_SECRET_ACCESS_KEY: ${SH_MINIO_ROOT_PASSWORD:?set SH_MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ../:/opt/streamhouse:ro
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SH_SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SH_SPARK_WORKER_MEMORY:-2g}"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- orchestration (Phase 5)
  #
  # Brought up separately:  make airflow-up
  #
  # Airflow's metadata lives in its OWN Postgres instance, not the OLTP one. Debezium is
  # replicating that database, and pointing Airflow at it would push thousands of task-instance
  # rows through the CDC pipeline - a scheduler writing into the system it schedules.

  postgres-meta:
    image: postgres:16
    container_name: sh-postgres-meta
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: ${SH_AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${SH_AIRFLOW_DB_PASSWORD:?set SH_AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: ${SH_AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SH_AIRFLOW_DB_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: create or upgrade the metadata schema, then exit. No user creation - see the
  # SimpleAuthManager note above.
  airflow-init:
    <<: *airflow-common
    container_name: sh-airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        echo "metadata database ready"

  airflow-apiserver:
    <<: *airflow-common
    container_name: sh-airflow-apiserver
    command: api-server
    ports:
      # 8080 is Redpanda Console's; Airflow gets 8088 on the host.
      - "${SH_AIRFLOW_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sh-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3 parses DAGs in a process of its own, separate from the scheduler.
  airflow-dag-processor:
    <<: *airflow-common
    container_name: sh-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
  metastore-data:
  dbt-target:
  postgres-meta-data:
  airflow-logs:

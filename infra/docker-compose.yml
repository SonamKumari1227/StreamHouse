# StreamHouse — local stack.
#
# Core profile only for Phase 0. Everything runs locally; no cloud services, credentials or SDKs.
#   docker compose -f infra/docker-compose.yml --profile core up -d
#
# connect and spark come up idle. No connector is registered and no job is submitted until Phase 2.
# They run so the stack is complete and its health is meaningful.

name: streamhouse

services:

  # ---------------------------------------------------------------- OLTP source
  postgres:
    image: postgres:16
    container_name: sh-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${SH_POSTGRES_USER:-streamhouse}
      POSTGRES_PASSWORD: ${SH_POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${SH_POSTGRES_DB:-streamhouse}
    # wal_level is set here rather than via ALTER SYSTEM so it is live on first boot.
    # ALTER SYSTEM would require a restart before Debezium could read the WAL.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${SH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first boot against an empty volume. `make db-init` re-applies it on demand.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SH_POSTGRES_USER:-streamhouse} -d ${SH_POSTGRES_DB:-streamhouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------- message bus
  redpanda:
    # v24.2.x rejects Fetch API v12, which librdkafka 2.6 (confluent-kafka) negotiates:
    #   WARN kafka - Unsupported version 12 for fetch API
    # Producing worked, consuming did not. 24.3+ supports it. Do not downgrade.
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    container_name: sh-redpanda
    profiles: ["core"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      # Two listeners: `internal` for containers, `external` for the host.
      # The external listener advertises localhost:9092 so host clients reconnect correctly.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:9092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${SH_REDPANDA_PORT:-9092}:19092"        # Kafka API
      - "${SH_SCHEMA_REGISTRY_PORT:-8081}:18081" # built-in schema registry
      - "9644:9644"                           # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: sh-redpanda-console
    profiles: ["core"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: streamhouse
      CONNECT_CLUSTERS_URL: http://connect:8083
    ports:
      - "${SH_CONSOLE_PORT:-8080}:8080"
    # No healthcheck: the console image ships no shell HTTP client to probe with.
    # Verify it by opening http://localhost:8080 instead.
    restart: unless-stopped

  # ---------------------------------------------------------------- CDC (idle until Phase 2)
  connect:
    # `2.7` is not a published tag; Debezium publishes X.Y.Z.Final only.
    image: debezium/connect:2.7.3.Final
    container_name: sh-connect
    profiles: ["core"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: streamhouse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Defaults to JSON. Phase 2 switches these to Avro against the schema registry.
    ports:
      - "${SH_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------- object store
  minio:
    # Docker Hub's minio/minio now requires authentication; quay.io is the public registry.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sh-minio
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SH_MINIO_ROOT_USER:-streamhouse}
      MINIO_ROOT_PASSWORD: ${SH_MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (min 8 chars)}
    ports:
      - "${SH_MINIO_PORT:-9000}:9000"          # S3 API
      - "${SH_MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- compute (idle until Phase 2)
  spark-master:
    image: apache/spark:3.5.3
    container_name: sh-spark-master
    profiles: ["core"]
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      - "7077:7077"                        # cluster endpoint
      - "${SH_SPARK_UI_PORT:-8090}:8080"      # master web UI
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.3
    container_name: sh-spark-worker
    profiles: ["core"]
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SH_SPARK_WORKER_CORES:-2}"
      - --memory
      - "${SH_SPARK_WORKER_MEMORY:-2g}"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redpanda-data:
  minio-data:

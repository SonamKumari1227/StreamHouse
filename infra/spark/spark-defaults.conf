# Persistent Spark configuration. Baked into the image so every driver and executor gets it
# without --conf flags on the command line - a working config that lives only in a shell
# history is not a working config.

# ---------------------------------------------------------------- Delta Lake
spark.sql.extensions                      io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog           org.apache.spark.sql.delta.catalog.DeltaCatalog

# ---------------------------------------------------------------- S3A -> MinIO
# Endpoint is the in-network MinIO service, never AWS. path.style.access is REQUIRED: the
# default virtual-host addressing would resolve bucket.minio, which does not exist.
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the container
# environment, which compose populates from .env. They are deliberately NOT written here -
# this file is committed.
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# MinIO is a single local node; the AWS retry defaults assume a globally distributed service
# and turn a simple misconfiguration into a multi-minute hang.
spark.hadoop.fs.s3a.attempts.maximum      3
spark.hadoop.fs.s3a.connection.establish.timeout 5000
spark.hadoop.fs.s3a.connection.timeout    10000

# ---------------------------------------------------------------- misc
spark.sql.session.timeZone                UTC
spark.ui.showConsoleProgress              false

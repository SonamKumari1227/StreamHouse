[tool.pytest.ini_options]
# Lets `from generator... import ...` resolve without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests need the Docker stack, so they are opt-in: `pytest -m integration`.
# A -m on the command line overrides this one.
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: needs Docker (testcontainers)",
    "chaos: exercises an injected failure scenario",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
